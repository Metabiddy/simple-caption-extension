<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caption</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="header">
    <h1>Caption</h1>
    <p class="subtitle">Local SRT subtitles for web video</p>
  </header>

  <section class="panel-section">
    <label class="file-label">
      <input type="file" id="fileInput" accept=".srt,text/plain" hidden />
      <span class="btn btn-primary">Load .srt</span>
    </label>
    <button type="button" id="clearBtn" class="btn btn-secondary">Clear</button>
    <p id="status" class="status" role="status"></p>
  </section>

  <section class="panel-section mode-section">
    <div class="mode-row">
      <label class="toggle-label" for="bilibiliModeToggle">
        <span class="toggle-title">Bilibili mode</span>
        <span class="toggle-desc" id="bilibiliModeHint">Click a cue to jump the video</span>
      </label>
      <input type="checkbox" id="bilibiliModeToggle" class="toggle-input" role="switch" aria-checked="false" />
    </div>
  </section>

  <section class="panel-section delay-section">
    <h2>Delay</h2>
    <p class="hint">Positive = subtitles appear later</p>
    <div class="delay-controls">
      <button type="button" class="btn btn-small" data-delta="-0.5">−0.5s</button>
      <button type="button" class="btn btn-small" data-delta="-0.1">−0.1s</button>
      <label class="offset-input-wrap">
        <input type="number" id="offsetInput" class="offset-input" step="0.1" value="0" title="Delay in seconds" />
        <span class="offset-unit">s</span>
      </label>
      <button type="button" class="btn btn-small" data-delta="0.1">+0.1s</button>
      <button type="button" class="btn btn-small" data-delta="0.5">+0.5s</button>
    </div>
    <div class="delay-actions">
      <button type="button" id="resetOffsetBtn" class="btn btn-ghost">Reset delay</button>
      <button type="button" id="applyOffsetBtn" class="btn btn-ghost">Apply</button>
    </div>
  </section>

  <section class="panel-section cue-section">
    <div class="cue-header">
      <h2>Cues</h2>
      <button type="button" id="locateCueBtn" class="btn btn-small" title="Scroll to current subtitle">Locate</button>
    </div>
    <p id="currentCueTime" class="current-cue-time">Subtitle time: —</p>
    <input type="search" id="searchInput" class="search" placeholder="Search subtitles…" />
    <p id="cueMeta" class="cue-meta"></p>
    <ul id="cueList" class="cue-list"></ul>
  </section>

  <script src="../shared/messages.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../lib/srt-parser.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
